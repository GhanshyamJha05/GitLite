<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitLite Visualizer</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --primary: #58a6ff;
      --accent: #238636;
      --accent-hover: #2ea043;
      --danger: #f85149;
      --warning: #d29922;
      --node-color: #58a6ff;
      --head-badge: #f78166;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      background: var(--border);
      color: var(--text-muted);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    select, button {
      background: #21262d;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      border-color: rgba(240,246,252,0.1);
      color: #fff;
      font-weight: 600;
    }
    button.primary:hover {
      background: var(--accent-hover);
    }

    /* Main layout */
    .workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
      overflow: hidden;
    }

    /* Left pane: DAG Graph & Commits */
    .pane-graph {
      flex: 1;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pane-title {
      padding: 10px 16px;
      background: rgba(22, 27, 34, 0.7);
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }
    .commit-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }
    .commit-item {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(48, 54, 61, 0.5);
      cursor: pointer;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      transition: background 0.15s ease;
    }
    .commit-item:hover {
      background: rgba(110, 118, 129, 0.08);
    }
    .commit-item.active {
      background: rgba(56, 139, 253, 0.15);
      border-left: 3px solid var(--primary);
    }
    .commit-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--node-color);
      margin-top: 6px;
      flex-shrink: 0;
    }
    .commit-item.is-head .commit-dot {
      background: var(--head-badge);
      box-shadow: 0 0 6px var(--head-badge);
    }
    .commit-body {
      flex: 1;
      min-width: 0;
    }
    .commit-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .commit-subject {
      font-size: 0.95rem;
      font-weight: 600;
      color: #f0f6fc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .commit-hash {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.8rem;
      color: var(--primary);
      background: rgba(56, 139, 253, 0.1);
      padding: 1px 6px;
      border-radius: 4px;
    }
    .commit-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      gap: 12px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .branch-tag {
      background: #238636;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 10px;
    }
    .head-tag {
      background: #bd561d;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 10px;
    }

    /* Right pane: Details & Diff */
    .pane-detail {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #0d1117;
    }
    .detail-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .detail-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .detail-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 8px;
    }
    .detail-row {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: flex;
      gap: 8px;
    }
    .detail-row span.val {
      color: var(--text);
    }
    .diff-block {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .diff-header {
      padding: 10px 14px;
      background: #161b22;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .diff-status {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .diff-status.added { background: rgba(35, 134, 54, 0.2); color: #3fb950; }
    .diff-status.modified { background: rgba(210, 153, 34, 0.2); color: #d29922; }
    .diff-status.deleted { background: rgba(248, 81, 73, 0.2); color: #f85149; }

    pre.diff-patch {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.8rem;
      padding: 12px;
      overflow-x: auto;
      line-height: 1.45;
      background: #090d13;
    }
    .line-add { color: #3fb950; background: rgba(46, 160, 67, 0.15); display: block; }
    .line-del { color: #f85149; background: rgba(248, 81, 73, 0.15); display: block; }
    .line-hunk { color: #58a6ff; display: block; }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">
        <svg height="24" viewBox="0 0 16 16" width="24" fill="currentColor">
          <path d="M1 2.5A2.5 2.5 0 0 1 3.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 1 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 3.5 9h8ZM2.5 11a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z"></path>
        </svg>
        GitLite Visualizer
      </div>
      <span class="badge" id="workTreePath">...</span>
    </div>
    <div class="header-actions">
      <label for="branchSelect" style="font-size: 0.85rem; color: var(--text-muted);">Branch:</label>
      <select id="branchSelect"></select>
      <button class="primary" id="btnCheckout">Checkout</button>
      <button id="btnRefresh">Refresh</button>
    </div>
  </header>

  <div class="workspace">
    <!-- Graph & Commits -->
    <div class="pane-graph">
      <div class="pane-title">Commit Graph &amp; History</div>
      <ul class="commit-list" id="commitList"></ul>
    </div>

    <!-- Commit Diff / Inspect View -->
    <div class="pane-detail">
      <div class="pane-title">Inspector &amp; Diff</div>
      <div class="detail-content" id="detailContent">
        <div class="empty-state">Select a commit to inspect its changes</div>
      </div>
    </div>
  </div>

  <script>
    let graphData = null;
    let selectedHash = null;

    async function loadGraph() {
      try {
        const res = await fetch('/api/graph');
        graphData = await res.json();
        renderHeader();
        renderCommits();
      } catch (err) {
        console.error('Failed to load graph:', err);
      }
    }

    function renderHeader() {
      document.getElementById('workTreePath').textContent = graphData.work_tree || '';
      const select = document.getElementById('branchSelect');
      select.innerHTML = '';
      (graphData.branches || []).forEach(b => {
        const opt = document.createElement('option');
        opt.value = b.Name;
        opt.textContent = b.Name + (b.IsCurrent ? ' (HEAD)' : '');
        if (b.IsCurrent) opt.selected = true;
        select.appendChild(opt);
      });
    }

    function renderCommits() {
      const list = document.getElementById('commitList');
      list.innerHTML = '';

      if (!graphData.commits || graphData.commits.length === 0) {
        list.innerHTML = '<li class="empty-state">No commits in repository yet</li>';
        return;
      }

      graphData.commits.forEach(c => {
        const li = document.createElement('li');
        li.className = 'commit-item' + (c.is_head ? ' is-head' : '') + (c.hash === selectedHash ? ' active' : '');
        li.onclick = () => selectCommit(c.hash);

        let tagsHTML = '';
        if (c.is_head) {
          tagsHTML += '<span class="head-tag">HEAD</span> ';
        }
        (c.branches || []).forEach(b => {
          tagsHTML += `<span class="branch-tag">${b}</span> `;
        });

        li.innerHTML = `
          <div class="commit-dot"></div>
          <div class="commit-body">
            <div class="commit-header">
              <span class="commit-subject">${escapeHtml(c.subject || 'Empty commit message')}</span>
              <span class="commit-hash">${c.short_hash}</span>
            </div>
            <div class="commit-meta">
              ${tagsHTML}
              <span>${escapeHtml(c.author_name)}</span>
              <span>${new Date(c.author_date).toLocaleString()}</span>
            </div>
          </div>
        `;
        list.appendChild(li);
      });

      if (!selectedHash && graphData.commits.length > 0) {
        selectCommit(graphData.commits[0].hash);
      }
    }

    async function selectCommit(hash) {
      selectedHash = hash;
      document.querySelectorAll('.commit-item').forEach(el => {
        el.classList.remove('active');
      });
      // Set active on matching list item
      const listItems = document.querySelectorAll('.commit-item');
      graphData.commits.forEach((c, idx) => {
        if (c.hash === hash && listItems[idx]) {
          listItems[idx].classList.add('active');
        }
      });

      const container = document.getElementById('detailContent');
      container.innerHTML = '<div class="empty-state">Loading commit details...</div>';

      try {
        const res = await fetch(`/api/commit?hash=${hash}`);
        const detail = await res.json();
        renderDetail(detail);
      } catch (err) {
        container.innerHTML = `<div class="empty-state">Failed to load commit: ${err.message}</div>`;
      }
    }

    function renderDetail(detail) {
      const container = document.getElementById('detailContent');
      let diffsHTML = '';

      if (detail.diffs && detail.diffs.length > 0) {
        detail.diffs.forEach(d => {
          diffsHTML += `
            <div class="diff-block">
              <div class="diff-header">
                <span>${escapeHtml(d.path)}</span>
                <span class="diff-status ${d.status}">${d.status}</span>
              </div>
              <pre class="diff-patch">${formatPatch(d.patch)}</pre>
            </div>
          `;
        });
      } else {
        diffsHTML = '<div class="empty-state" style="padding: 20px;">No file changes in this commit (or root commit with no parent)</div>';
      }

      container.innerHTML = `
        <div class="detail-card">
          <div class="detail-title">${escapeHtml(detail.subject)}</div>
          <div class="detail-row"><span>Commit:</span> <span class="val">${detail.hash}</span></div>
          <div class="detail-row"><span>Author:</span> <span class="val">${escapeHtml(detail.author_name)} &lt;${escapeHtml(detail.author_email)}&gt;</span></div>
          <div class="detail-row"><span>Date:</span> <span class="val">${new Date(detail.author_date).toLocaleString()}</span></div>
          ${detail.message.length > detail.subject.length ? `<div style="margin-top: 10px; font-size: 0.85rem; white-space: pre-wrap;">${escapeHtml(detail.message)}</div>` : ''}
        </div>
        <h4 style="margin-bottom: 12px; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase;">Changed Files (${detail.diffs ? detail.diffs.length : 0})</h4>
        ${diffsHTML}
      `;
    }

    function formatPatch(patch) {
      if (!patch) return '';
      return patch.split('\n').map(line => {
        const escaped = escapeHtml(line);
        if (line.startsWith('+') && !line.startsWith('+++')) {
          return `<span class="line-add">${escaped}</span>`;
        }
        if (line.startsWith('-') && !line.startsWith('---')) {
          return `<span class="line-del">${escaped}</span>`;
        }
        if (line.startsWith('@@')) {
          return `<span class="line-hunk">${escaped}</span>`;
        }
        return escaped;
      }).join('\n');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.getElementById('btnRefresh').onclick = () => loadGraph();

    document.getElementById('btnCheckout').onclick = async () => {
      const target = document.getElementById('branchSelect').value;
      if (!target) return;
      try {
        const res = await fetch('/api/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ target })
        });
        const data = await res.json();
        if (data.error) {
          alert('Error checking out branch: ' + data.error);
        } else {
          loadGraph();
        }
      } catch (err) {
        alert('Network error: ' + err.message);
      }
    };

    loadGraph();
  </script>
</body>
</html>
