name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        check-latest: true

    - name: Verify Dependencies
      run: go mod verify

    - name: Static Analysis (go vet)
      run: go vet ./...

    - name: Run Tests with Race Detector
      run: go test -v -race ./...

    - name: Build Binary
      run: go build -v -o bin/gitlite ./cmd/gitlite

